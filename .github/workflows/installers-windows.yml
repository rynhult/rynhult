name: Windows installer

# Rynhult-Setup-<version>.exe (deploy/windows/acc.iss), built with Inno Setup on the Windows runner, then run silently as a
# dry run for both roles and uninstalled the same way (/DRYRUN: nothing on the runner changes). On tags it is
# attached to the GitHub release. Unsigned for now (docs/INSTALLER.md).
on:
  push:
    tags: ['v[1-9]*']  # installers build at v1.0 and later, or by hand (workflow_dispatch); not for 0.x tags
    branches: ['installer/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Pinned to commits (tags can be moved); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $findings = foreach ($path in 'deploy/windows', 'deploy/node/windows') {
            Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Warning, Error
          }
          $findings | Format-Table -AutoSize | Out-String -Width 200
          if ($findings) { exit 1 }
      - name: Self-test (PowerShell 7)
        shell: pwsh
        run: |
          ./deploy/windows/tests/Test-EnrollParser.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./deploy/windows/tests/Test-WslBootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./deploy/windows/tests/Test-InstallerSecurity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Most PCs run the installer's PowerShell in Windows PowerShell 5.1.
      - name: Self-test (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./deploy/windows/tests/Test-EnrollParser.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./deploy/windows/tests/Test-WslBootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./deploy/windows/tests/Test-InstallerSecurity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: install-acc.ps1 -Validate refuses a pasted command that is not the one
        shell: powershell
        run: |
          $env:ACC_ENROLL_COMMAND = 'acc-node enroll --primary https://acc.example.com --trust system --code 3fa21c-0b9d4e-77aa01-c4d5e6 --name lab-pc; calc.exe'
          ./deploy/windows/install-acc.ps1 -Role Node -Validate
          if ($LASTEXITCODE -ne 1) { exit 1 }
          $env:ACC_ENROLL_COMMAND = 'acc-node enroll --primary https://acc.example.com --trust system --code 3fa21c-0b9d4e-77aa01-c4d5e6 --name lab-pc'
          ./deploy/windows/install-acc.ps1 -Role Node -Validate
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build Rynhult-Setup.exe
        id: build
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc.FullName deploy\windows\acc.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $exe = "deploy\windows\Output\Rynhult-Setup-$version.exe"
          if (-not (Test-Path $exe)) { throw "expected $exe" }
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "name=Rynhult-Setup-$version.exe" >> $env:GITHUB_OUTPUT
      - name: Silent dry runs (main, main with a zone, node, a rejected command, uninstall)
        shell: pwsh
        run: ./deploy/windows/tests/Invoke-SetupDryRun.ps1 -Setup '${{ steps.build.outputs.exe }}' -LogDirectory "$env:RUNNER_TEMP\setup-logs" -InstallDirectory "$env:RUNNER_TEMP\acc-dry-run"
      - name: Logs
        if: always()
        shell: pwsh
        run: Get-ChildItem "$env:RUNNER_TEMP\setup-logs" -ErrorAction SilentlyContinue | ForEach-Object { "::group::$($_.Name)"; Get-Content $_.FullName; '::endgroup::' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Rynhult-Setup
          path: ${{ steps.build.outputs.exe }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: setup-logs
          path: ${{ runner.temp }}/setup-logs
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'rynhult/rynhult' && vars.RYNHULT_PUBLICATION_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # attach the .exe to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: Rynhult-Setup
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" "${release_flags[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Rynhult $TAG" --notes "Rynhult $TAG"
          gh release upload "$TAG" dist/Rynhult-Setup-*.exe --repo "$GITHUB_REPOSITORY" --clobber
