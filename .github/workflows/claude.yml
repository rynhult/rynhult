name: Claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    # Never process PR content with write credentials, including an owner's comment on a fork PR.
    # Only owner-authored issues and owner comments on those issues can invoke this job.
    if: |
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.issue.author_association == 'OWNER' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write  # the action exchanges an OIDC token for its GitHub App token
    steps:
      # Pinned to commits (tags can be moved); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --tools "Read,Grep,Glob" --allowedTools "Read,Grep,Glob"
