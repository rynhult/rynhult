[[mcp]]
id = "playwright"
name = "Playwright browser"
source = "https://github.com/microsoft/playwright-mcp (npm @playwright/mcp 0.0.83)"
license = "Apache-2.0"
providers = ["claude", "codex"]
command = "/srv/acc/tools/mcp/node_modules/.bin/playwright-mcp"  # installed from deploy/mcp/package-lock.json, never npx
args = ["--isolated", "--headless", "--browser", "chromium"]
env = { PLAYWRIGHT_BROWSERS_PATH = "/srv/acc/tools/ms-playwright" }
notes = "Local headless Chrome for Testing r1247 (shared, read-only). Isolated profile, no saved logins. Snapshots go to ./.playwright-mcp (git-ignored for the agent account)."

[[mcp]]
