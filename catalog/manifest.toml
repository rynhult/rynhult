# Rynhult catalog: curated, pinned, read-before-vendoring. This file is edited by hand, through PRs only.
# Items and profile changes made in the dashboard live in /srv/acc/catalog-local (see docs/wiki/Internal/Operations.md).
# providers: which CLIs can use an item. Agents are subagents: Claude, Cursor, Antigravity and OpenCode receive them.
# An upgrade is a new pin, a re-read of the diff, an update to this file and a PR. Rollback is git revert.

