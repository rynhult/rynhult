# Baseline for every Rynhult Codex session (least privilege, deterministic):
# - remote plugins load non-deterministically at startup (M7 qualification) and some act on remote OpenAI
#   services (Sites, Spaces), so every installed plugin is disabled explicitly;
# - built-in skills that install skills from the internet or call image APIs are hidden.
[codex]
disable_installed_plugins = true
hide_system_skills = ["skill-installer", "skill-creator", "imagegen"]
