<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throwaway terminal continuity comparison</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #17202b; color: #f4f6fa; font: 16px system-ui; }
  header { padding: 12px; min-height: 80px; }
  button { padding: 8px 12px; }
  button:focus-visible { outline: 3px solid #86c5ff; }
  main { display: flex; gap: 16px; padding: 16px; }
  .slot { width: 44vw; height: 340px; border: 2px solid #86c5ff; }
  #column2 { width: 36vw; height: 420px; }
  #fill { position: fixed; left: 16px; top: 100px; width: calc(100vw - 32px); height: calc(100vh - 116px); visibility: hidden; }
  #host { width: 100%; height: 100%; background: #10151c; }
  #layer { position: fixed; left: 0; top: 0; z-index: 2; }
  #layer #host { position: absolute; }
</style>
<header>
  <strong>Isolated fake PTY continuity prototype</strong>
  <button data-slot="column1">Column 1</button>
  <button data-slot="column2">Column 2</button>
  <button data-slot="fill">Expanded fill</button>
  <span id="status" role="status"></span>
</header>
<main aria-label="Terminal slots">
  <section id="column1" class="slot" aria-label="Column 1"></section>
  <section id="column2" class="slot" aria-label="Column 2"></section>
  <section id="fill" class="slot" aria-label="Expanded fill"></section>
</main>
<div id="layer"></div>
<script type="module" src="/prototype.mjs"></script>
</html>
