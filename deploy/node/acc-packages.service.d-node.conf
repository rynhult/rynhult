# Install: /etc/systemd/system/acc-packages.service.d/node.conf and acc-packages-daily.service.d/node.conf
# (deploy/node/install.sh). On a node there is no accd: acc-node writes the requests and reads state.json, so the
# helper's files are group acc-node instead of acc.
[Service]
Environment=ACC_PACKAGES_GROUP=acc-node
