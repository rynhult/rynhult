# Unprivileged builds only, through deploy/containers/build-image, which also passes a private throwaway --root,
# --runroot and --tmpdir and points the blob-info cache and scratch files there. Never the account's own store: a layer
# left there with the ID of a session image layer shadows the protected copy and the launcher refuses every launch
# (qualification attempt 11). Never use this profile for session launches.
# Used by hand, without build-image, this profile only moves the graphroot: the runroot ($XDG_RUNTIME_DIR/containers),
# libpod's state and the blob-info cache (~/.local/share/containers/cache) stay the account's defaults. That leaves no
# image layer where the launcher looks, but it is not isolated; build with build-image.
[storage]
driver = "overlay"
rootless_storage_path = "$HOME/.local/share/acc-image-build/storage"
