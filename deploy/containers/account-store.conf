# The agent account's own default store, with no additional store: only for listing or removing stray copies of session
# image layers there (scripts/container_qualification/image_store.py --check-store prints the exact commands, with the
# store's absolute --root and --runroot, never a home-relative path, so they address the checked store from any shell).
# Never for builds (deploy/containers/build-image) or session launches (storage.conf).
[storage]
driver = "overlay"
