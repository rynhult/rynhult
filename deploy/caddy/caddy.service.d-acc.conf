# ACC: Caddy with the Cloudflare DNS module (/usr/local/bin/caddy, from deploy/setup.sh when a zone is set),
# for one wildcard certificate via DNS-01. install.sh adds it only when that binary and cloudflare.env exist.
# Revert: remove this file, systemctl daemon-reload, systemctl restart caddy.
# --environ is dropped on purpose: it would print CF_API_TOKEN into the journal.
[Service]
EnvironmentFile=/etc/caddy/cloudflare.env
# Admin API socket lives here (see the Caddyfile global block).
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
ExecStart=
ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
