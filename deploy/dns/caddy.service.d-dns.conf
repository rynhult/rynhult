# Install during explicit migration preparation. Optional legacy fallback keeps recovery available.
[Service]
Environment="ACC_DNS_CONFIG=dns cloudflare {env.CF_API_TOKEN}"
EnvironmentFile=
EnvironmentFile=-/etc/caddy/cloudflare.env
EnvironmentFile=-/etc/caddy/acc-dns/current.env
ExecStart=
ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
# acc-dns adapts with the candidate credential; systemctl reload uses persisted credentials on restart only.
ExecReload=
ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
